name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AsistenciaSync.sln

      - name: Build
        run: dotnet build AsistenciaSync.sln -c Release --no-restore

      - name: Test
        run: dotnet test AsistenciaSync.sln -c Release --no-build --verbosity normal
